name: bridge-foundation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  source-history-scan:
    name: Source history secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned scanner and scan all commits
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-gitleaks.XXXXXXXX")
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "${tool_root}/gitleaks.tar.gz"
          expected=$(jq -r .gitleaks.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          printf '%s  %s\n' "${expected}" "${tool_root}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${tool_root}/gitleaks.tar.gz" -C "${tool_root}" --no-same-owner
          "${tool_root}/gitleaks" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow

  linux-sbf:
    name: Linux SBF and Native-Solana local E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build programs with pinned tools and external output
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-sbf.XXXXXXXX")
          printf 'KINGPEPE_CI_TOOL_ROOT=%s\n' "${tool_root}" >> "${GITHUB_ENV}"
          url=$(jq -r .solana.linuxArchiveUrl scripts/local-e2e-toolchain.json)
          expected=$(jq -r .solana.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 300 \
            "${url}" --output "${tool_root}/solana.tar.bz2"
          printf '%s  %s\n' "${expected}" "${tool_root}/solana.tar.bz2" | sha256sum --check
          tar -xjf "${tool_root}/solana.tar.bz2" -C "${tool_root}" --no-same-owner
          export PATH="${tool_root}/solana-release/bin:${PATH}"
          mkdir -p "${HOME}/.cache/solana" "${tool_root}/output"
          # Both the compiler-generated keypairs and Cargo output stay outside Git.
          platform_tools=$(jq -r .solana.platformToolsVersion scripts/local-e2e-toolchain.json)
          for program in kingpepe-transceiver kingpepe-bridge; do
            # Host metadata must select solana/rust-toolchain.toml, not the
            # older Native supporting-crate toolchain at the repository root.
            (
              cd solana
              cargo-build-sbf --manifest-path "programs/${program}/Cargo.toml" \
                --sbf-out-dir "${tool_root}/output" --tools-version "${platform_tools}" \
                -- --locked --jobs 2 --target-dir "${tool_root}/build/${program}"
            )
          done
          test -s "${tool_root}/output/kingpepe_transceiver.so"
          test -s "${tool_root}/output/kingpepe_bridge.so"
          sha256sum "${tool_root}/output/kingpepe_transceiver.so" "${tool_root}/output/kingpepe_bridge.so"
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"
      - name: Pin Node for local integration
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked integration dependencies
        run: npm ci --ignore-scripts
      - name: Build exact Native source for isolated regtest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libboost-dev libevent-dev libsqlite3-dev
          sha=$(jq -r .native.sourceCommit scripts/local-e2e-toolchain.json)
          expected=$(jq -r .native.sourceArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 300 \
            "https://codeload.github.com/kingpepe2/king-pepe-source-code/tar.gz/${sha}" \
            --output "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz"
          printf '%s  %s\n' "${expected}" "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz" | sha256sum --check
          tar -xzf "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz" -C "${KINGPEPE_CI_TOOL_ROOT}" --no-same-owner
          cmake -S "${KINGPEPE_CI_TOOL_ROOT}/king-pepe-source-code-${sha}" \
            -B "${KINGPEPE_CI_TOOL_ROOT}/native-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_WALLET=ON \
            -DENABLE_EXTERNAL_SIGNER=OFF
          cmake --build "${KINGPEPE_CI_TOOL_ROOT}/native-build" --target kingpeped kingpepe-cli -j 2
      - name: Real automatic Native to Solana local flow
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${KINGPEPE_CI_TOOL_ROOT}/native-build/bin:${PATH}"
          export KINGPEPE_LOCAL_E2E_ROOT="${KINGPEPE_CI_TOOL_ROOT}/run"
          export KINGPEPE_LOCAL_BUILD_ROOT="${KINGPEPE_CI_TOOL_ROOT}/build"
          # Full diagnostic material stays external and is not uploaded.
          flow_exit=0
          node solana/tests/local-deposit-security.mjs > "${KINGPEPE_CI_TOOL_ROOT}/result.json" || flow_exit=$?
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r = JSON.parse(readFileSync(process.env.KINGPEPE_CI_TOOL_ROOT + "/result.json", "utf8"));
            const f = r.nativeToSolanaE2e;
            console.log(JSON.stringify({sourceSha: process.env.GITHUB_SHA, state: r.state, reason: r.reason,
              failedStep: r.infrastructure?.failedStep,
              localSecurity: r.localSecurity,
              localRecovery: r.localRecovery,
              localRecoveryPsbt: r.localRecoveryPsbt,
              localRecoveryRaces: r.localRecoveryRaces,
              localClaimRetry: r.localClaimRetry,
              localAccounting: r.localAccounting,
              nativeEvidence: f?.nativeRawEvidence,
              nativeToSolana: r.fullNativeToSolanaE2e, reserve: f?.reconciliation?.canonicalReserve,
              observedMintSupply: f?.reconciliation?.mintedSupply, productionReady: false, mainnetActivation: "DISABLED"}));
            if (r.state !== "COMPLETED" || r.fullNativeToSolanaE2e !== "PASS") process.exit(1);
            if (r.localSecurity?.pass !== 22 || r.localSecurity?.fail !== 0) process.exit(1);
            if (r.localRecovery?.pass !== 7 || r.localRecovery?.fail !== 0) process.exit(1);
            if (r.localRecoveryPsbt?.pass !== 4 || r.localRecoveryPsbt?.fail !== 0) process.exit(1);
            if (r.localRecoveryRaces?.pass !== 10 || r.localRecoveryRaces?.fail !== 0) process.exit(1);
            if (r.localClaimRetry?.pass !== 7 || r.localClaimRetry?.fail !== 0) process.exit(1);
            for (const check of ["STOPPED_CLAIM_WORKER_REOPEN_DOES_NOT_OBSERVE_OR_SEND",
              "LATE_COMPLETION_CANNOT_CLEAR_STOPPED_CLAIM_JOURNAL"]) {
              if (!r.localClaimRetry.passed.includes(check)) process.exit(1);
            }
            if (r.localAccounting?.pass !== 5 || r.localAccounting?.fail !== 0) process.exit(1);
            if (f?.depositAccounting?.snapshot?.authorizedUnmintedCredits !== "0") process.exit(1);
            if (f?.depositIntent?.recoverable !== true || f.depositIntent.recoveryAvailableAfterSweep !== false) process.exit(1);
            if (f.depositIntent.scriptPubKeyHex === f.frostCustody.taprootScriptPubKeyHex) process.exit(1);
          '
          test "${flow_exit}" -eq 0
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"
      - name: Real atomic withdrawal-record prerequisite (no Native payout)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${KINGPEPE_CI_TOOL_ROOT}/native-build/bin:${PATH}"
          export KINGPEPE_LOCAL_E2E_ROOT="${KINGPEPE_CI_TOOL_ROOT}/withdrawal-record-run"
          export KINGPEPE_LOCAL_BUILD_ROOT="${KINGPEPE_CI_TOOL_ROOT}/build"
          node solana/tests/local-withdrawal-record.mjs > "${KINGPEPE_CI_TOOL_ROOT}/withdrawal-record-result.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r = JSON.parse(readFileSync(process.env.KINGPEPE_CI_TOOL_ROOT + "/withdrawal-record-result.json", "utf8"));
            console.log(JSON.stringify({sourceSha: process.env.GITHUB_SHA, ...r}));
            if (r.withdrawalRecord?.pass !== 26 || r.withdrawalRecord?.fail !== 0 || r.phase09 !== "NOT_STARTED") process.exit(1);
            for (const check of ["FRESH_USER_FRESH_PDA_FINALIZED_BURN_AND_RECORD",
              "DUPLICATE_WITHDRAWAL_NEW_NONCE_REJECTED", "MISSING_USER_SIGNATURE_REJECTED",
              "INSUFFICIENT_RECORD_RENT_ROLLS_BACK", "PREFUNDED_SYSTEM_PDA_SAFELY_INITIALIZED",
              "LATER_INSTRUCTION_FAILURE_ROLLS_BACK_BURN_RECORD_AND_RENT",
              "DIRECT_SPL_BURN_CREATES_NO_WITHDRAWAL_ENTITLEMENT"]) {
              if (!r.withdrawalRecord.passed.includes(check)) process.exit(1);
            }
          '

  foundation-guardrails:
    name: Foundation Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run local guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Check exact provenance coverage and publication boundary
        run: node scripts/source-audit.mjs
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Pin rust toolchain
        run: rustup toolchain install --profile minimal nightly-2023-10-29
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy --toolchain nightly-2023-10-29
      - name: Pin Solana host Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy 1.89.0
      - name: Audit every Rust lockfile without advisory suppression
        shell: bash
        run: |
          set -euo pipefail
          audit_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-audit.XXXXXXXX")
          url=$(jq -r .cargoAudit.linuxArchiveUrl scripts/local-e2e-toolchain.json)
          expected=$(jq -r .cargoAudit.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 120 "${url}" --output "${audit_root}/audit.tgz"
          printf '%s  %s\n' "${expected}" "${audit_root}/audit.tgz" | sha256sum --check
          tar -xzf "${audit_root}/audit.tgz" -C "${audit_root}" --strip-components=1 --no-same-owner
          for lockfile in solana/Cargo.lock native/{frost,proof,reserve,recovery}/Cargo.lock; do
            "${audit_root}/cargo-audit" audit --file "${lockfile}" --deny unsound --deny yanked
          done
      - name: Check dependency license metadata and local proprietary boundary
        run: node .github/scripts/dependency-license-audit.mjs
      - name: Validate Solana Rust formatting
        run: |
          cd solana
          cargo fmt --check --all
      - name: Validate native Rust formatting
        run: cargo fmt --check --manifest-path native/frost/Cargo.toml
      - name: Validate native proof formatting
        run: cargo fmt --check --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve formatting
        run: cargo fmt --check --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery formatting
        run: cargo fmt --check --manifest-path native/recovery/Cargo.toml
      - name: Run Solana clippy
        run: |
          cd solana
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run native clippy
        run: cargo clippy --locked --manifest-path native/frost/Cargo.toml --all-targets -- -D warnings
      - name: Run native proof clippy
        run: cargo clippy --locked --manifest-path native/proof/Cargo.toml --all-targets -- -D warnings
      - name: Run native reserve clippy
        run: cargo clippy --locked --manifest-path native/reserve/Cargo.toml --all-targets -- -D warnings
      - name: Run native recovery clippy
        run: cargo clippy --locked --manifest-path native/recovery/Cargo.toml --all-targets -- -D warnings
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Run Native node adapter tests
        run: npm run test:native-node
      - name: Run project attester tests
        run: npm run test:attesters
      - name: Run Solana observer tests
        run: npm run test:solana-observer
      - name: Run bridge validator tests
        run: npm run test:bridge-validator
      - name: Run local E2E readiness gate tests
        run: npm run test:local-e2e-readiness
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve crate
        run: cargo check --locked --manifest-path native/reserve/Cargo.toml --all-targets
      - name: Run native reserve tests
        run: cargo test --locked --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery crate
        run: cargo check --locked --manifest-path native/recovery/Cargo.toml --all-targets
      - name: Run native recovery tests
        run: cargo test --locked --manifest-path native/recovery/Cargo.toml

  foundation-windows-check:
    name: Foundation Windows Check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Windows DPAPI and protected-state failure regressions (current test identity)
        shell: pwsh
        run: |
          # Use the runner's installed Git OpenSSL for disposable TEST certificates.
          # Never install from an unreviewed mirror or skip if unavailable.
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $env:KINGPEPE_TEST_OPENSSL = Join-Path $gitRoot 'usr/bin/openssl.exe'
          if (-not (Test-Path -LiteralPath $env:KINGPEPE_TEST_OPENSSL)) { throw 'TEST_OPENSSL_REQUIRED' }
          & $env:KINGPEPE_TEST_OPENSSL version
          if ($LASTEXITCODE -ne 0) { throw 'TEST_OPENSSL_UNAVAILABLE' }
          npm run test:windows-security
      - name: Check exact provenance coverage and publication boundary
        run: node scripts/source-audit.mjs
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Run Native node adapter tests
        run: npm run test:native-node
      - name: Run project attester tests
        run: npm run test:attesters
      - name: Run Solana observer tests
        run: npm run test:solana-observer
      - name: Run bridge validator tests
        run: npm run test:bridge-validator
      - name: Run local E2E readiness gate tests
        run: npm run test:local-e2e-readiness
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve crate
        run: cargo check --locked --manifest-path native/reserve/Cargo.toml --all-targets
      - name: Run native reserve tests
        run: cargo test --locked --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery crate
        run: cargo check --locked --manifest-path native/recovery/Cargo.toml --all-targets
      - name: Run native recovery tests
        run: cargo test --locked --manifest-path native/recovery/Cargo.toml
