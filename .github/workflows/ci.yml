name: bridge-foundation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  source-history-scan:
    name: Source history secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned scanner and scan all commits
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-gitleaks.XXXXXXXX")
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "${tool_root}/gitleaks.tar.gz"
          expected=$(jq -r .gitleaks.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          printf '%s  %s\n' "${expected}" "${tool_root}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${tool_root}/gitleaks.tar.gz" -C "${tool_root}" --no-same-owner
          "${tool_root}/gitleaks" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow

  linux-sbf:
    name: Linux SBF and Native-Solana local E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build programs with pinned tools and external output
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-sbf.XXXXXXXX")
          printf 'KINGPEPE_CI_TOOL_ROOT=%s\n' "${tool_root}" >> "${GITHUB_ENV}"
          url=$(jq -r .solana.linuxArchiveUrl scripts/local-e2e-toolchain.json)
          expected=$(jq -r .solana.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 300 \
            "${url}" --output "${tool_root}/solana.tar.bz2"
          printf '%s  %s\n' "${expected}" "${tool_root}/solana.tar.bz2" | sha256sum --check
          tar -xjf "${tool_root}/solana.tar.bz2" -C "${tool_root}" --no-same-owner
          export PATH="${tool_root}/solana-release/bin:${PATH}"
          mkdir -p "${HOME}/.cache/solana" "${tool_root}/output"
          # Both the compiler-generated keypairs and Cargo output stay outside Git.
          platform_tools=$(jq -r .solana.platformToolsVersion scripts/local-e2e-toolchain.json)
          for program in kingpepe-transceiver kingpepe-bridge; do
            # Host metadata must select solana/rust-toolchain.toml, not the
            # older Native supporting-crate toolchain at the repository root.
            (
              cd solana
              cargo-build-sbf --manifest-path "programs/${program}/Cargo.toml" \
                --sbf-out-dir "${tool_root}/output" --tools-version "${platform_tools}" \
                -- --locked --jobs 2 --target-dir "${tool_root}/build/${program}"
            )
          done
          test -s "${tool_root}/output/kingpepe_transceiver.so"
          test -s "${tool_root}/output/kingpepe_bridge.so"
          sha256sum "${tool_root}/output/kingpepe_transceiver.so" "${tool_root}/output/kingpepe_bridge.so"
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"

      - name: Build exact current one-way source archive with pinned v3 tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${PATH}"
          # The authorized history cleanup retires the old deployment source.
          # Reproducibility now binds two builds to this exact one-way SHA.
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "${KINGPEPE_CI_TOOL_ROOT}/devnet-source"
          git archive "$GITHUB_SHA" | tar -x -C "${KINGPEPE_CI_TOOL_ROOT}/devnet-source"
          for program in kingpepe-transceiver kingpepe-bridge; do
            (
              cd "${KINGPEPE_CI_TOOL_ROOT}/devnet-source/solana"
              cargo-build-sbf --manifest-path "programs/${program}/Cargo.toml" \
                --sbf-out-dir "${KINGPEPE_CI_TOOL_ROOT}/devnet-output" --tools-version v1.54 --arch v3 \
                -- --locked --jobs 2 --target-dir "${KINGPEPE_CI_TOOL_ROOT}/devnet-build"
            )
          done
          test -s "${KINGPEPE_CI_TOOL_ROOT}/devnet-output/kingpepe_bridge.so"
          test -s "${KINGPEPE_CI_TOOL_ROOT}/devnet-output/kingpepe_transceiver.so"
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"
      - name: Build current production-target v3 artifacts without deployment
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${PATH}"
          for program in kingpepe-transceiver kingpepe-bridge; do
            (
              cd solana
              cargo-build-sbf --manifest-path "programs/${program}/Cargo.toml" \
                --sbf-out-dir "${KINGPEPE_CI_TOOL_ROOT}/production-output" --tools-version v1.54 --arch v3 \
                -- --locked --jobs 2 --target-dir "${KINGPEPE_CI_TOOL_ROOT}/production-build"
            )
          done
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
          sha256sum "${KINGPEPE_CI_TOOL_ROOT}/production-output/kingpepe_bridge.so" \
            "${KINGPEPE_CI_TOOL_ROOT}/production-output/kingpepe_transceiver.so"
          cmp "${KINGPEPE_CI_TOOL_ROOT}/devnet-output/kingpepe_bridge.so" \
            "${KINGPEPE_CI_TOOL_ROOT}/production-output/kingpepe_bridge.so"
          cmp "${KINGPEPE_CI_TOOL_ROOT}/devnet-output/kingpepe_transceiver.so" \
            "${KINGPEPE_CI_TOOL_ROOT}/production-output/kingpepe_transceiver.so"
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"
      - name: Pin Node for local integration
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked integration dependencies
        run: npm ci --ignore-scripts
      - name: Initial program deployment resume and existing Mint initialization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${PATH}"
          export KINGPEPE_DEPLOYMENT_TEST_ROOT="${KINGPEPE_CI_TOOL_ROOT}/program-deployment-regression"
          export KINGPEPE_TEST_LEDGER_PARENT="${KINGPEPE_CI_TOOL_ROOT}/deployment-ledgers"
          mkdir -m 700 "${KINGPEPE_TEST_LEDGER_PARENT}"
          export KINGPEPE_BURN_SBF_ROOT="${KINGPEPE_CI_TOOL_ROOT}/production-output"
          node solana/tests/mainnet-deployment-regression.mjs
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync(process.env.KINGPEPE_DEPLOYMENT_TEST_ROOT+"/evidence.json","utf8"));
            if(r.sourceSha!==process.env.GITHUB_SHA||r.exactSource!==true||r.result!=="PASS"||r.mainnetTransactions!==0||r.checks.length!==8||
              !r.checks.includes("PREFUNDED_EMPTY_CONFIGURATION_PDAS_INITIALIZE_SAFELY"))process.exit(1);
          '
      - name: Build exact Native source for isolated regtest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libboost-dev libevent-dev libsqlite3-dev
          sha=$(jq -r .native.sourceCommit scripts/local-e2e-toolchain.json)
          expected=$(jq -r .native.sourceArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 300 \
            "https://codeload.github.com/kingpepe2/king-pepe-source-code/tar.gz/${sha}" \
            --output "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz"
          printf '%s  %s\n' "${expected}" "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz" | sha256sum --check
          tar -xzf "${KINGPEPE_CI_TOOL_ROOT}/native.tar.gz" -C "${KINGPEPE_CI_TOOL_ROOT}" --no-same-owner
          cmake -S "${KINGPEPE_CI_TOOL_ROOT}/king-pepe-source-code-${sha}" \
            -B "${KINGPEPE_CI_TOOL_ROOT}/native-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF -DWITH_ZMQ=OFF -DBUILD_BITCOIN_BIN=OFF -DENABLE_WALLET=ON \
            -DENABLE_EXTERNAL_SIGNER=OFF
          cmake --build "${KINGPEPE_CI_TOOL_ROOT}/native-build" --target kingpeped kingpepe-cli -j 2
      - name: Build pinned Native proof verifier before starting test chains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal --component clippy --component rustfmt --component rust-src \
            --target wasm32-unknown-unknown nightly-2023-10-29
          cargo +nightly-2023-10-29 build --locked --manifest-path native/proof/Cargo.toml \
            --bin kingpepe-native-evidence --target-dir "${KINGPEPE_CI_TOOL_ROOT}/build/native-evidence"
      - name: Real Native burn policy, finality, reorg and restart proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${KINGPEPE_CI_TOOL_ROOT}/native-build/bin:${PATH}"
          export KINGPEPE_NATIVE_BURN_RUN_ROOT="${KINGPEPE_CI_TOOL_ROOT}/native-burn-proof"
          export KINGPEPE_TEST_NATIVE_VERIFIER="${KINGPEPE_CI_TOOL_ROOT}/build/native-evidence/debug/kingpepe-native-evidence"
          npm run local:proof:burn
      - name: Real burn evidence, Solana mint, replay and conservation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${KINGPEPE_CI_TOOL_ROOT}/solana-release/bin:${KINGPEPE_CI_TOOL_ROOT}/native-build/bin:${PATH}"
          export KINGPEPE_BURN_TEST_ROOT="${KINGPEPE_CI_TOOL_ROOT}/burn-chain-regression"
          export KINGPEPE_BURN_SBF_ROOT="${KINGPEPE_CI_TOOL_ROOT}/production-output"
          export KINGPEPE_TEST_NATIVE_VERIFIER="${KINGPEPE_CI_TOOL_ROOT}/build/native-evidence/debug/kingpepe-native-evidence"
          npm run local:e2e:native-to-solana
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync(process.env.KINGPEPE_BURN_TEST_ROOT+"/evidence.json","utf8"));
            if(r.sourceSha!==process.env.GITHUB_SHA||r.exactSource!==true||r.state!=="COMPLETED"||r.accounting.state!=="MATCH")process.exit(1);
            for(const check of ["DEPOSIT_OBSERVATION_CANNOT_AUTHORIZE_BURN_OR_MINT","MAXBURNAMOUNT_ONE_UNIT_OVERAGE_REJECTED",
              "PREFUNDED_EMPTY_OPERATION_ACCOUNTS_ARE_NOT_CLAIMS","PREFUNDED_EMPTY_RECEIPT_INITIALIZES_AFTER_FINALIZED_BURN",
              "BROADCAST_IS_NOT_MINT_AUTHORIZATION","ELEVEN_CONFIRMATIONS_AND_ORPHANED_BURN_REJECTED",
              "FINALIZED_EXACT_BURN_UNSPENDABLE_NO_SECOND_BURN","FINALIZED_BURN_RELOAD_RETAINS_PENDING_MINT_OBLIGATION",
              "ATTESTATION_RECEIPT_ALONE_DOES_NOT_MINT","FINALIZED_EXACT_MINT_TO_ORIGINAL_WALLET",
              "CLAIM_REPLAY_REJECTED_NO_SECOND_MINT","CRITICAL_ACCOUNTING_MISMATCH_PAUSES",
              "EXACT_DEPOSIT_BURN_MINT_SEPARATE_FEES_RECONCILIATION"])if(!r.checks.includes(check))process.exit(1);
            console.log(JSON.stringify({sourceSha:r.sourceSha,artifacts:r.artifacts,state:r.state,accounting:r.accounting,checks:r.checks,
              productionReady:false,mainnetActivation:"DISABLED"}));
          '
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"

  foundation-guardrails:
    name: Foundation Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run local guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Check exact provenance coverage and publication boundary
        run: node scripts/source-audit.mjs
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Pin rust toolchain
        run: rustup toolchain install --profile minimal nightly-2023-10-29
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy --toolchain nightly-2023-10-29
      - name: Pin Solana host Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy 1.89.0
      - name: Audit every Rust lockfile without advisory suppression
        shell: bash
        run: |
          set -euo pipefail
          audit_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-audit.XXXXXXXX")
          url=$(jq -r .cargoAudit.linuxArchiveUrl scripts/local-e2e-toolchain.json)
          expected=$(jq -r .cargoAudit.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 120 "${url}" --output "${audit_root}/audit.tgz"
          printf '%s  %s\n' "${expected}" "${audit_root}/audit.tgz" | sha256sum --check
          tar -xzf "${audit_root}/audit.tgz" -C "${audit_root}" --strip-components=1 --no-same-owner
          for lockfile in solana/Cargo.lock native/proof/Cargo.lock; do
            "${audit_root}/cargo-audit" audit --file "${lockfile}" --deny unsound --deny yanked
          done
      - name: Check dependency license metadata and local proprietary boundary
        run: node .github/scripts/dependency-license-audit.mjs
      - name: Validate Solana Rust formatting
        run: |
          cd solana
          cargo fmt --check --all
      - name: Validate native proof formatting
        run: cargo fmt --check --manifest-path native/proof/Cargo.toml
      - name: Run Solana clippy
        run: |
          cd solana
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run native proof clippy
        run: cargo clippy --locked --manifest-path native/proof/Cargo.toml --all-targets -- -D warnings
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Verify burn protocol, attestation, transport, accounting and API regressions
        run: npm test
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml

  foundation-windows-check:
    name: Foundation Windows Check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Windows DPAPI and protected-state failure regressions (current test identity)
        shell: pwsh
        run: |
          # Protected controller fixtures require the genuine source-built
          # Native verifier, not an executable placeholder or an RPC assertion.
          rustup toolchain install --profile minimal nightly-2023-10-29
          if ($LASTEXITCODE -ne 0) { throw 'TEST_NATIVE_TOOLCHAIN_UNAVAILABLE' }
          $testBuild = Join-Path $env:RUNNER_TEMP ('kingpepe-native-verifier-' + [guid]::NewGuid().ToString('N'))
          $testArtifact = Join-Path $testBuild 'artifact'
          New-Item -ItemType Directory -Path $testArtifact -ErrorAction Stop | Out-Null
          cargo +nightly-2023-10-29 build --locked --manifest-path native/proof/Cargo.toml --bin kingpepe-native-evidence --target-dir $testBuild
          if ($LASTEXITCODE -ne 0) { throw 'TEST_NATIVE_VERIFIER_BUILD_FAILED' }
          $builtVerifier = Join-Path $testBuild 'debug/kingpepe-native-evidence.exe'
          $env:KINGPEPE_TEST_NATIVE_VERIFIER = Join-Path $testArtifact 'kingpepe-native-evidence.exe'
          # Cargo's hard-linked output is not an approved runtime path.
          Copy-Item -LiteralPath $builtVerifier -Destination $env:KINGPEPE_TEST_NATIVE_VERIFIER -ErrorAction Stop
          $env:KINGPEPE_TEST_NATIVE_VERIFIER_SHA256 = (Get-FileHash -LiteralPath $env:KINGPEPE_TEST_NATIVE_VERIFIER -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $builtVerifier -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:KINGPEPE_TEST_NATIVE_VERIFIER_SHA256) {
            throw 'TEST_NATIVE_VERIFIER_COPY_MISMATCH'
          }
          # Use the runner's installed Git OpenSSL for disposable TEST certificates.
          # Never install from an unreviewed mirror or skip if unavailable.
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $env:KINGPEPE_TEST_OPENSSL = Join-Path $gitRoot 'usr/bin/openssl.exe'
          if (-not (Test-Path -LiteralPath $env:KINGPEPE_TEST_OPENSSL)) { throw 'TEST_OPENSSL_REQUIRED' }
          & $env:KINGPEPE_TEST_OPENSSL version
          if ($LASTEXITCODE -ne 0) { throw 'TEST_OPENSSL_UNAVAILABLE' }
          npm run test:windows-security
      - name: Check exact provenance coverage and publication boundary
        run: node scripts/source-audit.mjs
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Verify burn protocol, attestation, transport, accounting and API regressions
        run: npm test
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml
