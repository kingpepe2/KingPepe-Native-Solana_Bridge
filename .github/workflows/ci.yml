name: bridge-foundation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  source-history-scan:
    name: Source history secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned scanner and scan all commits
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-gitleaks.XXXXXXXX")
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "${tool_root}/gitleaks.tar.gz"
          expected=$(jq -r .gitleaks.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          printf '%s  %s\n' "${expected}" "${tool_root}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${tool_root}/gitleaks.tar.gz" -C "${tool_root}" --no-same-owner
          "${tool_root}/gitleaks" git . --redact=100 --no-banner

  linux-sbf:
    name: Linux SBF build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build programs with pinned tools and external output
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "${RUNNER_TEMP}/kingpepe-sbf.XXXXXXXX")
          url=$(jq -r .solana.linuxArchiveUrl scripts/local-e2e-toolchain.json)
          expected=$(jq -r .solana.linuxArchiveSha256 scripts/local-e2e-toolchain.json)
          curl --fail --location --silent --show-error --max-time 300 \
            "${url}" --output "${tool_root}/solana.tar.bz2"
          printf '%s  %s\n' "${expected}" "${tool_root}/solana.tar.bz2" | sha256sum --check
          tar -xjf "${tool_root}/solana.tar.bz2" -C "${tool_root}" --no-same-owner
          export PATH="${tool_root}/solana-release/bin:${PATH}"
          mkdir -p "${HOME}/.cache/solana" "${tool_root}/output"
          # Both the compiler-generated keypairs and Cargo output stay outside Git.
          for program in kingpepe-transceiver kingpepe-bridge; do
            cargo-build-sbf --manifest-path "solana/programs/${program}/Cargo.toml" \
              --sbf-out-dir "${tool_root}/output" --tools-version v1.41 \
              -- --locked --jobs 2 --target-dir "${tool_root}/target-${program}"
          done
          test -s "${tool_root}/output/kingpepe_transceiver.so"
          test -s "${tool_root}/output/kingpepe_bridge.so"
          sha256sum "${tool_root}/output/kingpepe_transceiver.so" "${tool_root}/output/kingpepe_bridge.so"
          test -z "$(find . -path './.git' -prune -o -name '*-keypair.json' -print)"

  foundation-guardrails:
    name: Foundation Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run local guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Pin rust toolchain
        run: rustup toolchain install --profile minimal nightly-2023-10-29
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy --toolchain nightly-2023-10-29
      - name: Validate Solana Rust formatting
        run: |
          cd solana
          cargo fmt --check --all
      - name: Validate native Rust formatting
        run: cargo fmt --check --manifest-path native/frost/Cargo.toml
      - name: Validate native proof formatting
        run: cargo fmt --check --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve formatting
        run: cargo fmt --check --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery formatting
        run: cargo fmt --check --manifest-path native/recovery/Cargo.toml
      - name: Run Solana clippy
        run: |
          cd solana
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run native clippy
        run: cargo clippy --locked --manifest-path native/frost/Cargo.toml --all-targets -- -D warnings
      - name: Run native proof clippy
        run: cargo clippy --locked --manifest-path native/proof/Cargo.toml --all-targets -- -D warnings
      - name: Run native reserve clippy
        run: cargo clippy --locked --manifest-path native/reserve/Cargo.toml --all-targets -- -D warnings
      - name: Run native recovery clippy
        run: cargo clippy --locked --manifest-path native/recovery/Cargo.toml --all-targets -- -D warnings
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Run Native node adapter tests
        run: npm run test:native-node
      - name: Run project attester tests
        run: npm run test:attesters
      - name: Run Solana observer tests
        run: npm run test:solana-observer
      - name: Run bridge validator tests
        run: npm run test:bridge-validator
      - name: Run local E2E readiness gate tests
        run: npm run test:local-e2e-readiness
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve crate
        run: cargo check --locked --manifest-path native/reserve/Cargo.toml --all-targets
      - name: Run native reserve tests
        run: cargo test --locked --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery crate
        run: cargo check --locked --manifest-path native/recovery/Cargo.toml --all-targets
      - name: Run native recovery tests
        run: cargo test --locked --manifest-path native/recovery/Cargo.toml

  foundation-windows-check:
    name: Foundation Windows Check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run guardrails
        run: python .github/scripts/guardrails.py
      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Run Native node adapter tests
        run: npm run test:native-node
      - name: Run project attester tests
        run: npm run test:attesters
      - name: Run Solana observer tests
        run: npm run test:solana-observer
      - name: Run bridge validator tests
        run: npm run test:bridge-validator
      - name: Run local E2E readiness gate tests
        run: npm run test:local-e2e-readiness
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml
      - name: Validate native proof crate
        run: cargo check --locked --manifest-path native/proof/Cargo.toml --all-targets
      - name: Run native proof tests
        run: cargo test --locked --manifest-path native/proof/Cargo.toml
      - name: Validate native reserve crate
        run: cargo check --locked --manifest-path native/reserve/Cargo.toml --all-targets
      - name: Run native reserve tests
        run: cargo test --locked --manifest-path native/reserve/Cargo.toml
      - name: Validate native recovery crate
        run: cargo check --locked --manifest-path native/recovery/Cargo.toml --all-targets
      - name: Run native recovery tests
        run: cargo test --locked --manifest-path native/recovery/Cargo.toml
