name: bridge-foundation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  foundation-guardrails:
    name: Foundation Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run local guardrails
        run: python .github/scripts/guardrails.py
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Pin rust toolchain
        run: rustup toolchain install --profile minimal nightly-2023-10-29
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy --toolchain nightly-2023-10-29
      - name: Validate Solana Rust formatting
        run: |
          cd solana
          cargo fmt --check --all
      - name: Validate native Rust formatting
        run: cargo fmt --check --manifest-path native/frost/Cargo.toml
      - name: Run Solana clippy
        run: |
          cd solana
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run native clippy
        run: cargo clippy --locked --manifest-path native/frost/Cargo.toml --all-targets -- -D warnings
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml

  foundation-windows-check:
    name: Foundation Windows Check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run guardrails
        run: python .github/scripts/guardrails.py
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Audit Node dependencies
        run: npm audit --audit-level=low
      - name: Validate Solana workspace
        run: |
          cd solana
          cargo check --locked --workspace --all-targets
      - name: Run Solana workspace tests
        run: |
          cd solana
          cargo test --locked --workspace
      - name: Verify TypeScript protocol vectors
        run: node solana/ts/scripts/verify-vectors.mjs
      - name: Run Native FROST Node tests
        run: npm run test:frost
      - name: Validate native FROST runtime
        run: cargo check --locked --manifest-path native/frost/Cargo.toml
      - name: Run native FROST tests
        run: cargo test --locked --manifest-path native/frost/Cargo.toml
