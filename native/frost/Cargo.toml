[package]
name = "frost_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1.0", default-features = false, features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
