[package]
name = "bridge-messages"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../LICENSE"

[lib]
name = "bridge_messages"
path = "src/lib.rs"

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
sha2 = "0.10.9"
serde_json = "1.0.151"
